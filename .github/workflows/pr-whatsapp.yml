name: PR merged -> WhatsApp

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    # PRs closed without merging do not send.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send WhatsApp message via WasenderAPI
        env:
          # PR fields are untrusted input: pass via env, never inline in the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          WASENDER_API_KEY: ${{ secrets.WASENDER_API_TOKEN }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          set -euo pipefail

          body="${PR_BODY:-No description provided.}"
          if [ "${#body}" -gt 800 ]; then body="${body:0:800}..."; fi

          text="$(printf '*PR merged in %s*\n*%s*\nby %s, merged by %s (%s -> %s)\n\n%s\n\n%s' \
            "$REPO" "$PR_TITLE" "$PR_AUTHOR" "$MERGED_BY" "$PR_HEAD" "$PR_BASE" "$body" "$PR_URL")"

          payload="$(jq -n --arg to "$WHATSAPP_TO" --arg text "$text" '{to: $to, text: $text}')"

          curl --fail-with-body -sS -X POST "https://www.wasenderapi.com/api/send-message" \
            -H "Authorization: Bearer $WASENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload"
